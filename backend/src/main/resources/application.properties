# ------------------------------------------------------------------
# application.properties = Spring Boot's central config file.
# Every key here tweaks an "auto-configuration" Spring set up for you.
# Full list: https://docs.spring.io/spring-boot/appendix/application-properties/
# ------------------------------------------------------------------
spring.application.name=backend

# Port the embedded Tomcat web server listens on (8080 is the default; written out for clarity).
server.port=8080

# --- Database (H2) ---
# H2 is a small Java database. "file:" stores it on disk in ./data so your
# imported questions and progress survive restarts. (Use "mem:" for throw-away.)
spring.datasource.url=jdbc:h2:file:./data/gh600
spring.datasource.username=sa
spring.datasource.password=

# Web UI to browse the DB: http://localhost:8080/h2-console  (JDBC URL = the url above)
spring.h2.console.enabled=true

# --- JPA / Hibernate ---
# "update" = Hibernate creates/alters tables to match your @Entity classes.
# Great while learning; real apps use migrations (Flyway) instead - we'll get there.
spring.jpa.hibernate.ddl-auto=update
# Print the SQL Hibernate generates, so you can see what JPA does under the hood.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
